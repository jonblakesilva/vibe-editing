name: Studio tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r studio/requirements.txt httpx

      - name: Studio tests (fast set)
        run: python -m pytest -m "not slow" -o addopts="" -p no:warnings

      - name: Original kit tests
        run: python -m pytest plugins/vibe-editing/tests plugins/vibe-editing/skills/caption-clips/scripts/test_spice_format.py -o addopts="" -p no:warnings

      - name: Doctor (quick)
        run: python -m studio doctor --quick
