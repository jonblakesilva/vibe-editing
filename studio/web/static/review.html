<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review - Vibe Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=8">
<link rel="stylesheet" href="/static/review.css?v=7">
</head>
<body class="review">
<header class="rv-top">
  <a id="backLink" class="rv-back" href="/">Back to project</a>
  <div class="rv-title">
    <button id="prevAsset" type="button" title="Previous video ([)" aria-label="Previous video">Prev</button>
    <select id="assetSel" aria-label="Choose a video"></select>
    <button id="nextAsset" type="button" title="Next video (])" aria-label="Next video">Next</button>
    <h1 id="assetName" class="sr-only">Loading</h1>
    <select id="versionSel" aria-label="Version"></select>
    <button id="compareBtn" type="button" aria-pressed="false">Compare versions</button>
  </div>
  <div class="rv-actions">
    <select id="statusSel" aria-label="Review status">
      <option value="needs_review">Needs review</option>
      <option value="in_progress">In progress</option>
      <option value="changes_requested">Changes requested</option>
      <option value="approved">Approved</option>
    </select>
    <a id="downloadLink" class="btn" download>Download</a>
  </div>
</header>

<div class="rv-body">
  <nav class="rv-assets" id="assetList" aria-label="Videos in this project"></nav>

  <section class="rv-stage">
    <div class="rv-players" id="players">
      <figure class="rv-player" id="pA">
        <figcaption id="capA"></figcaption>
        <div class="rv-frame">
          <video id="vA" preload="auto" playsinline></video>
          <canvas id="draw" aria-label="Drawing layer"></canvas>
        </div>
      </figure>
      <figure class="rv-player" id="pB" hidden>
        <figcaption>
          <select id="versionSelB" aria-label="Compare with version"></select>
        </figcaption>
        <div class="rv-frame"><video id="vB" preload="auto" playsinline muted></video></div>
      </figure>
    </div>

    <div class="rv-scrub" id="scrub" role="slider" aria-label="Seek" tabindex="0">
      <div class="rv-buffer" id="buffer"></div>
      <div class="rv-range" id="rangeSel" hidden></div>
      <div class="rv-played" id="played"></div>
      <div id="markers"></div>
      <div class="rv-hover" id="hoverTip" hidden></div>
    </div>

    <div class="rv-controls">
      <button id="playBtn" type="button" aria-label="Play">Play</button>
      <button id="backFrame" type="button" aria-label="Back one frame" title="Back one frame (Left arrow)">-1f</button>
      <button id="fwdFrame" type="button" aria-label="Forward one frame" title="Forward one frame (Right arrow)">+1f</button>
      <span class="rv-tc"><b id="tc">00:00:00:00</b> / <span id="dur">00:00:00:00</span></span>
      <select id="rate" aria-label="Playback speed">
        <option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option>
      </select>
      <label class="rv-vol">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="1"></label>
      <button id="fsBtn" type="button">Full screen</button>
      <button id="keysBtn" type="button" class="ghost">Shortcuts</button>
    </div>
    <p class="rv-keys" id="keysHelp" hidden>
      Space or K play/pause - J back 1 s - L forward 1 s - Left/Right one frame - Shift+Left/Right 1 s -
      I set start, O set end of a range - C write a comment - D draw - Esc clear
    </p>
  </section>

  <aside class="rv-comments">
    <div class="rv-cbar">
      <h2>Comments <span id="cCount" class="meta"></span></h2>
      <select id="cFilter" aria-label="Show">
        <option value="open">Open</option><option value="all">All</option><option value="resolved">Done</option>
      </select>
    </div>
    <ol id="cList" class="rv-clist"></ol>

    <form id="composer" class="rv-composer">
      <div class="rv-crow">
        <button type="button" id="tcChip" class="rv-chip" title="Comment time. Press I and O to mark a range.">00:00:00:00</button>
        <div class="rv-tools" role="group" aria-label="Drawing tools">
          <button type="button" data-tool="pen" title="Draw (D)">Pen</button>
          <button type="button" data-tool="arrow">Arrow</button>
          <button type="button" data-tool="rect">Box</button>
          <input type="color" id="penColor" value="#F97316" aria-label="Drawing color">
          <button type="button" id="clearDraw" class="ghost">Clear</button>
        </div>
      </div>
      <textarea id="cText" rows="2" placeholder="Leave a comment at this moment (Enter to send, Shift+Enter for a new line)"></textarea>
      <p id="cMsg" class="rv-msg" role="status"></p>
      <div class="rv-crow">
        <span id="who" class="meta"></span>
        <button class="primary" id="sendBtn">Comment</button>
      </div>
    </form>
  </aside>
</div>
<script src="/static/review.js?v=8"></script>
</body>
</html>
