<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/" id="homeLink">Vibe Studio</a>
  <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
  <div class="top-actions">
    <button class="ghost" id="brandsBtn">Brands</button>
    <button class="ghost" id="themeBtn" aria-label="Switch light or dark mode">Dark mode</button>
    <button class="primary" id="newBtn">New video</button>
  </div>
</header>

<main id="home" class="page">
  <div class="home-head">
    <h1>Your videos</h1>
    <p class="sub">Pick a video to keep editing, or add a new recording. Your originals are never changed.</p>
  </div>
  <div id="library" class="library-grid"></div>
</main>

<main id="project" class="page" hidden>
  <section class="hero">
    <div class="hero-text">
      <h1 id="projName"></h1>
      <p id="projMeta" class="sub"></p>
    </div>
    <ol class="steps" id="steps" aria-label="Progress"></ol>
  </section>

  <div class="workspace">
    <div class="col-main">
      <div class="player-card">
        <div class="chips" id="sourceChips" role="tablist" aria-label="Which version to watch"></div>
        <video id="player" controls preload="metadata" playsinline></video>
        <div class="strip-wrap">
          <div id="strip" class="strip" role="img" aria-label="Your recording: kept parts and removed mistakes"></div>
          <div class="legend"><span class="key kept"></span>Kept <span class="key cut"></span>Removed <span id="stripInfo" class="muted"></span></div>
        </div>
      </div>

      <form id="askForm" class="card ask">
        <label for="askText">Tell the editor what to change</label>
        <div class="row">
          <input id="askText" placeholder="e.g. make the captions smaller, remove that zoom, keep this section" autocomplete="off">
          <button class="secondary">Apply</button>
        </div>
        <p class="hint">Pause the video first if your request is about "this" moment.</p>
        <p id="askMsg" class="msg" role="status"></p>
      </form>

      <form id="noteForm" class="card ask">
        <label for="noteText">Leave a note at <span id="noteTime">0:00.0</span></label>
        <div class="row">
          <input id="noteText" placeholder="Pause where you want the note, type, press Enter" autocomplete="off">
          <button class="secondary" id="noteBtn">Add note</button>
        </div>
        <p id="noteMsg" class="msg" role="status"></p>
        <ul id="noteList" class="note-list"></ul>
      </form>
    </div>

    <aside class="col-side">
      <div class="card next" id="nextCard"></div>
      <div class="card jobs" id="jobs" aria-live="polite"></div>
      <div class="card tabs-card">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="edit" aria-selected="true">Edit</button>
          <button role="tab" data-tab="style">Style</button>
          <button role="tab" data-tab="shorts">Shorts</button>
          <button role="tab" data-tab="files">Downloads</button>
        </div>
        <div class="tabpanel" id="tab-edit"></div>
        <div class="tabpanel" id="tab-style" hidden></div>
        <div class="tabpanel" id="tab-shorts" hidden></div>
        <div class="tabpanel" id="tab-files" hidden></div>
      </div>
    </aside>
  </div>
</main>

<dialog id="newDialog">
  <form method="dialog" id="newForm">
    <h2>Add a recording</h2>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="video/*">
      <span id="dropText"><b>Drop a video here</b><br>or click to choose a file</span>
    </label>
    <label>Or paste a file or folder path (a Tella export folder works)
      <input id="pathInput" placeholder="C:\Users\you\Videos\recording.mp4">
    </label>
    <fieldset class="choice" id="modeChoice">
      <legend>What should I make?</legend>
      <label><input type="radio" name="mode" value="repurpose" checked><span><b>Full video + Shorts</b><small>YouTube edit plus the best stand-alone clips</small></span></label>
      <label><input type="radio" name="mode" value="longform"><span><b>Full video</b><small>One polished edit of the whole recording</small></span></label>
      <label><input type="radio" name="mode" value="shorts"><span><b>One Short</b><small>A single vertical video</small></span></label>
    </fieldset>
    <div class="row2">
      <label>Brand <select id="brandInput"><option value="">No brand</option></select></label>
      <label>Shorts <select id="shortsCount"><option>3</option><option selected>5</option><option>8</option></select></label>
      <label>Short length <select id="shortLen"><option value="15,30">15-30 s</option><option value="20,60" selected>20-60 s</option><option value="45,90">45-90 s</option></select></label>
    </div>
    <p id="newMsg" class="msg" role="status"></p>
    <div class="dialog-actions">
      <button value="cancel" formnovalidate class="ghost">Cancel</button>
      <button class="primary" id="createBtn" value="default">Import and plan</button>
    </div>
  </form>
</dialog>

<dialog id="brandDialog">
  <form method="dialog" id="brandForm">
    <h2>Brands</h2>
    <div id="brandList"></div>
    <div id="brandQ"></div>
    <div class="row">
      <input id="brandName" placeholder="New brand name">
      <button id="brandCreate" type="button" class="secondary">Create</button>
    </div>
    <div class="dialog-actions"><button value="close" class="primary">Done</button></div>
  </form>
</dialog>

<script src="/static/app.js?v=10"></script>
</body>
</html>
